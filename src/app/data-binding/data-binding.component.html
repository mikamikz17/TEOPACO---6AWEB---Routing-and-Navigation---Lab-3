<h1>{{ studentName }}</h1>

<h2>Property Binding</h2>
<img [src]="imageUrl" width="200" />
<button [disabled]="isDisabled">Submit</button>

<h2>Class Binding</h2>
<p [class.pass]="isPassing" [class.failing]="!isPassing">
  Student Result: {{ isPassing ? 'Passed' : 'Failed' }}
</p>

<h2>Style Binding</h2>
<div
  [style.background]="boxColor"
  [style.width]="boxSize"
  [style.height]="boxSize"
  class="box">
</div>
